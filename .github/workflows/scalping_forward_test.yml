name: Scalping Forward Test Runner (24/7 Continuous Relay Loop)

on:
  workflow_dispatch: # Allows manual trigger & self-chaining relay triggers
  schedule:
    # Backup safety-net watchdog every 30 minutes to revive the loop if interrupted
    - cron: '*/30 * * * 1-5'

permissions:
  contents: write
  actions: write

jobs:
  run-forward-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Scalping Engine Relay Session (12 Minutes Continuous Ticks)
        run: npx tsx scripts/scalper-daemon.ts --duration-minutes 12

      - name: Commit & Push Updated Trade Records
        run: |
          git config --global user.name "Scalping-ForwardTest-Bot"
          git config --global user.email "bot@scalper.ai"
          git pull origin main --rebase || true
          git add scalping_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-record forward test tick [skip ci]" && git push origin main)

      - name: Trigger Next Relay Run (Continuous 24/7 Chain)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Passing relay baton: triggering next workflow run on $REPO..."
          curl -s -f -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/actions/workflows/scalping_forward_test.yml/dispatches" \
            -d '{"ref":"main"}' || echo "Self-chain dispatch completed"
