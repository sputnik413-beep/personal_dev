name: Scalping Forward Test Runner (24/5 FX Cron)

on:
  schedule:
    # Run every 5 minutes from Monday 00:00 UTC through Friday 21:55 UTC (FX Market Hours)
    - cron: '*/5 * * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-forward-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Scalping Engine Single Step
        run: npx tsx scripts/scalper-daemon.ts --single-pass

      - name: Commit & Push Updated Trade Records
        run: |
          git config --global user.name "Scalping-ForwardTest-Bot"
          git config --global user.email "bot@scalper.ai"
          git add scalping_state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-record forward test tick [skip ci]" && git push)
